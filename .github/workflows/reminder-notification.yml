name: Reminder Notification

on:
  schedule:
    # 12:00 UTC = 15:00 TRT
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Send Turn Notif
        run: node scripts/sendReminderNotification.js
